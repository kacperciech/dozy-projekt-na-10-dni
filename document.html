<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOŁOMP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- EKRAN LOGOWANIA: Formularz wprowadzania nicku przed rozpoczęciem gry -->
    <div id="login-ekran">
        <h1>GOŁOMP</h1>
        <p data-i18n="login_gra_opis">Podaj swój nick, żeby zagrać</p>
        <input id="nick-input" type="text" maxlength="12" data-i18n-placeholder="nick_placeholder" placeholder="Twój nick" autocomplete="off">
        <button id="zaloguj-btn" data-i18n="graj_btn">Graj</button>
        <p id="login-blad"></p>
    </div>

    <!-- EKRAN GRY + TABELA WYNIKÓW -->
    <div id="gra-kontener" class="hidden">
        <!-- Główna plansza gry renderowana w technologii HTML5 Canvas -->
        <canvas id="gra" width="400" height="600"></canvas>

        <!-- Panel boczny z informacjami o graczu i tabelą TOP wyników -->
        <aside id="panel">
            <p><span data-i18n="gracz">Gracz:</span> <strong id="nick-wyswietl"></strong></p>
            <button id="wyloguj-btn" data-i18n="zmien_gracza">Zmień gracza</button>
            <a href="index.html" class="menu-link" data-i18n="menu">← Menu</a>

            <h2 data-i18n="tabela">Tabela wyników</h2>
            <ol id="tabela"></ol>
        </aside>
    </div>

    <!-- Dołączenie skryptu tłumaczeń oraz głównej logiki gry Flappy -->
    <script src="rowerek.js"></script>
    <script src="game.js"></script>
</body>
</html>
