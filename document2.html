<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- EKRAN LOGOWANIA DO GRY SNAKE -->
    <div id="login-ekran">
        <h1>SNAKE</h1>
        <p data-i18n="login_gra_opis">Podaj swój nick, żeby zagrać</p>
        <input id="nick-input" type="text" maxlength="12" data-i18n-placeholder="nick_placeholder" placeholder="Twój nick" autocomplete="off">
        <button id="zaloguj-btn" data-i18n="graj_btn">Graj</button>
        <p id="login-blad"></p>
    </div>

    <!-- EKRAN AKTYWNEJ GRY I PANEL BOCZNY -->
    <div id="gra-kontener" class="hidden">
        <!-- Plansza węża -->
        <canvas id="gra" width="400" height="400"></canvas>

        <aside id="panel">
            <p><span data-i18n="gracz">Gracz:</span> <strong id="nick-wyswietl"></strong></p>
            <button id="wyloguj-btn" data-i18n="zmien_gracza">Zmień gracza</button>
            <a href="index.html" class="menu-link" data-i18n="menu">← Menu</a>

            <!-- Podpowiedzi dotyczące sterowania -->
            <p class="opis">
                <span data-i18n="snake_panel_1">Sterowanie: strzałki lub WASD</span><br>
                <span data-i18n="snake_panel_2">P: pauza</span><br>
                <span data-i18n="snake_panel_3">Telefon: przesuń palcem</span>
            </p>

            <h2 data-i18n="tabela">Tabela wyników</h2>
            <ol id="tabela"></ol>
        </aside>
    </div>

    <!-- Skrypty systemu tłumaczeń oraz logiki gry Snake -->
    <script src="rowerek.js"></script>
    <script src="game2.js"></script>
</body>
</html>
