<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- Ustawienia dokumentu oraz wspólny arkusz stylów ekranów gier. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Przełącznik motywu jest wspólny dla menu i wszystkich gier. -->
    <button type="button" class="motyw-przelacznik" data-motyw-przelacz aria-label="Jasny motyw">
        <span aria-hidden="true">☀️</span>
        <span data-motyw-etykieta>Jasny motyw</span>
    </button>

    <!-- Formularz nicku wyświetlany przed uruchomieniem Snake'a. -->
    <div id="login-ekran">
        <h1>SNAKE</h1>
        <p data-i18n="login_gra_opis">Podaj swój nick, żeby zagrać</p>
        <input id="nick-input" type="text" maxlength="12" data-i18n-placeholder="nick_placeholder" placeholder="Twój nick" autocomplete="off">
        <button id="zaloguj-btn" data-i18n="graj_btn">Graj</button>
        <p id="login-blad"></p>
    </div>

    <!-- Obszar aktywnej gry: plansza Canvas oraz panel gracza i rankingu. -->
    <div id="gra-kontener" class="hidden">
        <section class="plansza-kontener snake-plansza" aria-label="Snake">
            <!-- Plansza Snake'a rysowana i aktualizowana przez game2.js. -->
            <canvas id="gra" width="400" height="400"></canvas>
            <div class="sterowanie-dotykowe snake-przyciski" aria-label="Sterowanie Snake">
                <button type="button" data-kierunek="ArrowUp" data-i18n-aria-label="kontrolka_gora">↑</button>
                <button type="button" data-kierunek="ArrowLeft" data-i18n-aria-label="kontrolka_lewo">←</button>
                <button type="button" data-kierunek="ArrowDown" data-i18n-aria-label="kontrolka_dol">↓</button>
                <button type="button" data-kierunek="ArrowRight" data-i18n-aria-label="kontrolka_prawo">→</button>
                <button type="button" id="snake-pauza-btn" class="snake-pauza-btn" data-i18n="snake_pauzuj">Pauza</button>
            </div>
        </section>

        <aside id="panel">
            <p><span data-i18n="gracz">Gracz:</span> <strong id="nick-wyswietl"></strong></p>
            <button id="wyloguj-btn" data-i18n="zmien_gracza">Zmień gracza</button>
            <a href="index.html" class="menu-link" data-i18n="menu">← Menu</a>

            <!-- Podpowiedzi dotyczące sterowania -->
            <p class="opis">
                <span data-i18n="snake_panel_1">Sterowanie: strzałki lub WASD</span><br>
                <span data-i18n="snake_panel_2">P: pauza</span><br>
                <span data-i18n="snake_panel_3">Telefon: przesuń palcem</span>
            </p>

            <h2 data-i18n="tabela">Tabela wyników</h2>
            <ol id="tabela"></ol>
        </aside>
    </div>

    <!-- Wspólny skrypt tłumaczeń i motywu musi załadować się przed logiką gry. -->
    <script src="rowerek.js"></script>
    <script src="game2.js"></script>
</body>
</html>
