<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button type="button" class="motyw-przelacznik" data-motyw-przelacz aria-label="Jasny motyw">
        <span aria-hidden="true">☀️</span>
        <span data-motyw-etykieta>Jasny motyw</span>
    </button>

    <div id="login-ekran">
        <h1>BREAKOUT</h1>
        <p data-i18n="login_gra_opis">Podaj swój nick, żeby zagrać</p>
        <input id="nick-input" type="text" maxlength="12" data-i18n-placeholder="nick_placeholder" placeholder="Twój nick" autocomplete="off">
        <button id="zaloguj-btn" data-i18n="graj_btn">Graj</button>
        <p id="login-blad"></p>
    </div>

    <div id="gra-kontener" class="hidden">
        <div class="breakout-plansza">
            <canvas id="gra" class="breakout-canvas" width="480" height="600"></canvas>
            <div class="sterowanie-dotykowe breakout-przyciski" aria-label="Sterowanie Breakout">
                <button type="button" data-ruch-paletki="-1" data-i18n-aria-label="kontrolka_lewo">←</button>
                <button type="button" id="breakout-pauza-btn" data-i18n="breakout_pauzuj">Pauza</button>
                <button type="button" data-ruch-paletki="1" data-i18n-aria-label="kontrolka_prawo">→</button>
            </div>
            <section class="breakout-selektor" aria-labelledby="breakout-poziomy-tytul">
                <h2 id="breakout-poziomy-tytul" data-i18n="breakout_wybierz_poziom">Wybierz poziom</h2>
                <div class="breakout-poziomy" role="group" aria-labelledby="breakout-poziomy-tytul">
                    <button type="button" class="breakout-poziom-btn" data-poziom="1" data-i18n="breakout_poziom_1">Poziom 1</button>
                    <button type="button" class="breakout-poziom-btn" data-poziom="2" data-i18n="breakout_poziom_2">Poziom 2</button>
                    <button type="button" class="breakout-poziom-btn" data-poziom="3" data-i18n="breakout_poziom_3">Poziom 3</button>
                    <button type="button" class="breakout-poziom-btn" data-poziom="4" data-i18n="breakout_poziom_4">Poziom 4</button>
                    <button type="button" class="breakout-poziom-btn" data-poziom="5" data-i18n="breakout_poziom_5">Poziom 5</button>
                </div>
                <p data-i18n="breakout_zmiana_poziomu">Zmiana poziomu rozpoczyna nową grę.</p>
            </section>
        </div>

        <aside id="panel">
            <p><span data-i18n="gracz">Gracz:</span> <strong id="nick-wyswietl"></strong></p>
            <button id="wyloguj-btn" data-i18n="zmien_gracza">Zmień gracza</button>
            <a href="index.html" class="menu-link" data-i18n="menu">← Menu</a>
            <p class="opis" data-i18n="breakout_ster">Sterowanie: strzałki lub A/D, mysz albo dotyk</p>
            <p><span data-i18n="breakout_zycia">Życia:</span> <strong id="zycia-wyswietl">3</strong></p>

            <h2 data-i18n="tabela">Tabela wyników</h2>
            <ol id="tabela"></ol>
        </aside>
    </div>

    <script src="rowerek.js"></script>
    <script src="breakout.js"></script>
</body>
</html>
