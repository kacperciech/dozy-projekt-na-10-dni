<html lang="pl">
<head>

  html, body {
    margin: 0;

  }
  </style>
</head>
<body>
<a href="index.html" class="menu-link" data-i18n="menu">← Menu</a>
<canvas id="gra" width="960" height="540"></canvas>

<script src="rowerek.js"></script>
<script>
// ---------- 0. GRACZ ----------
// Nick wpisuje się na stronie głównej. Bez nicku wracamy do menu.
const nick = localStorage.getItem("nick") || "";
if (nick === "") location.replace("index.html");

document.title = t("rajd_nazwa");
// ---------- 1. USTAWIENIA ----------
const canvas = document.getElementById("gra");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const SWIAT_W = 1600;
const SWIAT_H = 1000;
const CX = 800;            // środek trasy
const CY = 500;
const N = 120;             // ile punktów ma trasa
const PULA = 42;           // połowa szerokości asfaltu
const ZWIR = 34;           // pas żwiru po bokach asfaltu
const OKRAZEN = 3;         // ile okrążeń w wyścigu
const CP_R = 75;           // promień punktu kontrolnego
const KLUCZ = "wyniki_rajd";   // tak samo czyta to strona główna

// Nawierzchnie: przyczepność (grip) i maksymalna prędkość
const MAT = {
    asfalt: { nazwa: "nawierz_asfalt", przyczepnosc: 1.0,  vmax: 520 },
    zwir:   { nazwa: "nawierz_zwir",   przyczepnosc: 0.6,  vmax: 400 },
    trawa:  { nazwa: "nawierz_trawa",  przyczepnosc: 0.45, vmax: 280 },
    blato:  { nazwa: "nawierz_blato",  przyczepnosc: 0.25, vmax: 220 }
};
// ---------- 2. TRASA ----------
// Zamknięta pętla: punkty na elipsie z falami, żeby zakręty były różne.
const trasa = [];
for (let i = 0; i < N; i++) {
    const th = (i / N) * Math.PI * 2;
    const r = 330 + 80 * Math.sin(3 * th) + 40 * Math.cos(5 * th);
    trasa.push({ x: CX + r * Math.cos(th), y: CY + r * Math.sin(th) * 0.85 });
}

// Błoto leży na trasie w wybranych miejscach
const BLOTA = [
    { x: trasa[20].x, y: trasa[20].y, r: 55 },
    { x: trasa[70].x, y: trasa[70].y, r: 50 },
    { x: trasa[98].x, y: trasa[98].y, r: 45 }
];

// Punkty kontrolne w kolejności: indeksy punktów trasy.
// Ostatni (0) to meta, czyli punkt startu.
const PUNKTY_CP = [30, 60, 90, 0];

const startAng = Math.atan2(trasa[1].y - trasa[0].y, trasa[1].x - trasa[0].x);
