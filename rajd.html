<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdówka</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  canvas {
    width: 960px;
    max-width: 100%;
    height: auto;
    border: 3px solid #333;
    background: #000;
  }
  .menu-link {
    position: fixed;
    top: 10px;
    left: 14px;
    z-index: 5;
    color: #4EC0CA;
    text-decoration: none;
    font-weight: bold;
    background: rgba(0, 0, 0, 0.55);
    padding: 6px 12px;
    border-radius: 8px;
  }
  .menu-link:hover {
    color: #f9d71c;
  }
  </style>
</head>
<body>
<a href="index.html" class="menu-link" data-i18n="menu">← Menu</a>
<canvas id="gra" width="960" height="540"></canvas>

<script src="rowerek.js"></script>
<script>
// ---------- 0. GRACZ ----------
// Nick wpisuje się na stronie głównej. Bez nicku wracamy do menu.
const nick = localStorage.getItem("nick") || "";
if (nick === "") location.replace("index.html");

document.title = t("rajd_nazwa");
// ---------- 1. USTAWIENIA ----------
const canvas = document.getElementById("gra");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const SWIAT_W = 1600;
const SWIAT_H = 1000;
const CX = 800;            // środek trasy
const CY = 500;
const N = 120;             // ile punktów ma trasa
const PULA = 42;           // połowa szerokości asfaltu
const ZWIR = 34;           // pas żwiru po bokach asfaltu
const OKRAZEN = 3;         // ile okrążeń w wyścigu
const CP_R = 75;           // promień punktu kontrolnego
const KLUCZ = "wyniki_rajd";   // tak samo czyta to strona główna

// Nawierzchnie: przyczepność (grip) i maksymalna prędkość
const MAT = {
    asfalt: { nazwa: "nawierz_asfalt", przyczepnosc: 1.0,  vmax: 520 },
    zwir:   { nazwa: "nawierz_zwir",   przyczepnosc: 0.6,  vmax: 400 },
    trawa:  { nazwa: "nawierz_trawa",  przyczepnosc: 0.45, vmax: 280 },
    blato:  { nazwa: "nawierz_blato",  przyczepnosc: 0.25, vmax: 220 }
};
// ---------- 2. TRASA ----------
// Zamknięta pętla: punkty na elipsie z falami, żeby zakręty były różne.
const trasa = [];
for (let i = 0; i < N; i++) {
    const th = (i / N) * Math.PI * 2;
    const r = 330 + 80 * Math.sin(3 * th) + 40 * Math.cos(5 * th);
    trasa.push({ x: CX + r * Math.cos(th), y: CY + r * Math.sin(th) * 0.85 });
}

// Błoto leży na trasie w wybranych miejscach
const BLOTA = [
    { x: trasa[20].x, y: trasa[20].y, r: 55 },
    { x: trasa[70].x, y: trasa[70].y, r: 50 },
    { x: trasa[98].x, y: trasa[98].y, r: 45 }
];

// Punkty kontrolne w kolejności: indeksy punktów trasy.
// Ostatni (0) to meta, czyli punkt startu.
const PUNKTY_CP = [30, 60, 90, 0];

const startAng = Math.atan2(trasa[1].y - trasa[0].y, trasa[1].x - trasa[0].x);
// ---------- 3. WYNIKI (czas w sekundach, im mniej tym lepiej) ----------
function wczytajWyniki() {
    try {
        return JSON.parse(localStorage.getItem(KLUCZ)) || {};
    } catch (e) {
        return {};
    }
}
// ---------- 4. STAN GRY ----------
let auto, czas, running, finished, okrazenie, nastepnyCP, lapStart, lapTimes, slad;
let top3 = [];
let kamera = { x: 0, y: 0 };
const klawisze = {};

let najlepszy = wczytajWyniki()[nick];
if (najlepszy === undefined) najlepszy = null;

function reset() {
    auto = { x: trasa[0].x, y: trasa[0].y, ang: startAng, vx: 0, vy: 0 };
    czas = 0;
    running = false;   // zegar rusza po pierwszym wciśnięciu klawisza
    finished = false;
    okrazenie = 0;
    nastepnyCP = 0;
    lapStart = 0;
    lapTimes = [];
    slad = [];
}
// ---------- 5. POMOCNICZE ----------
function najblizszyPunkt(x, y) {
    let best = Infinity;
    for (let i = 0; i < trasa.length; i++) {
        const d = Math.hypot(trasa[i].x - x, trasa[i].y - y);
        if (d < best) best = d;
    }
    return best;
}

function wBlocie(x, y) {
    return BLOTA.some(function (b) {
        return Math.hypot(b.x - x, b.y - y) < b.r;
    });
}

function powierzchnia(x, y) {
    if (wBlocie(x, y)) return MAT.blato;
    const d = najblizszyPunkt(x, y);
    if (d <= PULA) return MAT.asfalt;
    if (d <= PULA + ZWIR) return MAT.zwir;
    return MAT.trawa;
}

function fmtCzas(s) {
    const min = Math.floor(s / 60);
    const sek = (s % 60).toFixed(2).padStart(5, "0");
    return min + ":" + sek;
}

function wcisniete(kody) {
    return kody.some(function (k) { return klawisze[k]; });
}

const GAZ = ["ArrowUp", "KeyW"];
const HAMULEC = ["ArrowDown", "KeyS"];
const LEWO = ["ArrowLeft", "KeyA"];
const PRAWO = ["ArrowRight", "KeyD"];
const RECZNY = ["Space"];
// ---------- 6. FIZYKA ----------
function aktualizuj(dt) {
    const mat = powierzchnia(auto.x, auto.y);

    const gaz = wcisniete(GAZ);
    const ham = wcisniete(HAMULEC);
    const lewo = wcisniete(LEWO);
    const prawo = wcisniete(PRAWO);
    const reczny = wcisniete(RECZNY);

    if (gaz || ham || lewo || prawo || reczny) running = true;

    // przyspieszanie w kierunku, w którym patrzy auto
    let fx = Math.cos(auto.ang);
    let fy = Math.sin(auto.ang);
    if (gaz) {
        auto.vx += fx * 300 * dt;
        auto.vy += fy * 300 * dt;
    }

    // hamowanie lub jazda wstecz
    let wzdluz = auto.vx * fx + auto.vy * fy;
    if (ham) {
        if (wzdluz > 10) {
            const k = Math.max(0, 1 - 3 * dt);
            auto.vx *= k;
            auto.vy *= k;
        } else {
            auto.vx -= fx * 120 * dt;
            auto.vy -= fy * 120 * dt;
        }
    }

    // opór toczenia
    const opor = Math.max(0, 1 - 0.35 * dt);
    auto.vx *= opor;
    auto.vy *= opor;

    // limit prędkości zależny od nawierzchni
    let predkosc = Math.hypot(auto.vx, auto.vy);
    if (predkosc > mat.vmax) {
        const s = mat.vmax / predkosc;
        auto.vx *= s;
        auto.vy *= s;
        predkosc = mat.vmax;
    }

    // skręcanie: im szybciej, tym mocniej, ale w mało szybkim aucie nie skręcisz
    const sf = Math.min(1, predkosc / 150);
    const kierunek = wzdluz >= 0 ? 1 : -1;
    if (lewo) auto.ang -= 2.4 * sf * kierunek * dt;
    if (prawo) auto.ang += 2.4 * sf * kierunek * dt;

    // przyczepność: rozkładamy prędkość na "do przodu" i "w bok",
    // bok z czasem wygasa. Na błocie wygasa wolno, więc auto ślizga.
    fx = Math.cos(auto.ang);
    fy = Math.sin(auto.ang);
    let wz = auto.vx * fx + auto.vy * fy;
    let latx = auto.vx - fx * wz;
    let laty = auto.vy - fy * wz;

    const przyczepnosc = mat.przyczepnosc * (reczny ? 0.25 : 1);
    const tlum = Math.max(0, 1 - przyczepnosc * 8 * dt);
    latx *= tlum;
    laty *= tlum;

    if (reczny) wz *= Math.max(0, 1 - 1.5 * dt);   // hamulec ręczny też hamuje

    auto.vx = fx * wz + latx;
    auto.vy = fy * wz + laty;

    // ślad po poślizgu
    const bok = Math.hypot(latx, laty);
    if (bok > 70) {
        slad.push({ x: auto.x, y: auto.y });
        if (slad.length > 400) slad.shift();
    }

    // ruch
    auto.x += auto.vx * dt;
    auto.y += auto.vy * dt;

    // granice świata
    if (auto.x < 20) { auto.x = 20; auto.vx = 0; }
    if (auto.x > SWIAT_W - 20) { auto.x = SWIAT_W - 20; auto.vx = 0; }
    if (auto.y < 20) { auto.y = 20; auto.vy = 0; }
    if (auto.y > SWIAT_H - 20) { auto.y = SWIAT_H - 20; auto.vy = 0; }

    // punkty kontrolne i okrążenia
    const cp = trasa[PUNKTY_CP[nastepnyCP]];
    if (Math.hypot(auto.x - cp.x, auto.y - cp.y) < CP_R) {
        nastepnyCP++;
        if (nastepnyCP === PUNKTY_CP.length) {
            nastepnyCP = 0;
            okrazenie++;
            lapTimes.push(czas - lapStart);
            lapStart = czas;
            if (okrazenie === OKRAZEN) koniec();
        }
    }
}

// Meta: zapisz czas gracza (tylko jeśli to jego najlepszy) i przygotuj TOP 3
function koniec() {
    finished = true;
    running = false;

    const wyniki = wczytajWyniki();
    const wynik = Number(czas.toFixed(2));
    if (wyniki[nick] === undefined || wynik < wyniki[nick]) {
        wyniki[nick] = wynik;
        try {
            localStorage.setItem(KLUCZ, JSON.stringify(wyniki));
        } catch (e) {}
    }
    najlepszy = wyniki[nick];

    top3 = Object.entries(wyniki)
        .sort(function (a, b) { return a[1] - b[1]; })
        .slice(0, 3);
}
// ---------- 7. RYSOWANIE ----------
function sciezka(szer, kolor, cx, cy) {
    ctx.beginPath();
    ctx.moveTo(trasa[0].x - cx, trasa[0].y - cy);
    for (let i = 1; i < trasa.length; i++) {
        ctx.lineTo(trasa[i].x - cx, trasa[i].y - cy);
    }
    ctx.closePath();
    ctx.lineWidth = szer;
    ctx.strokeStyle = kolor;
    ctx.lineJoin = "round";
    ctx.stroke();
}

function rysujTrawe(cx, cy) {
    ctx.fillStyle = "#4f7d2c";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    const gx0 = Math.floor(cx / 40), gx1 = Math.floor((cx + W) / 40);
    const gy0 = Math.floor(cy / 40), gy1 = Math.floor((cy + H) / 40);
    for (let gx = gx0; gx <= gx1; gx++) {
        for (let gy = gy0; gy <= gy1; gy++) {
            if ((gx * 31 + gy * 17) % 5 === 0) {
                ctx.fillRect(gx * 40 - cx + 8, gy * 40 - cy + 10, 12, 6);
            }
        }
    }
}

function rysujBloto(cx, cy) {
    for (let i = 0; i < BLOTA.length; i++) {
        const b = BLOTA[i];
        ctx.fillStyle = "rgba(90, 59, 30, 0.85)";
        ctx.beginPath();
        ctx.arc(b.x - cx, b.y - cy, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(50, 30, 15, 0.6)";
        ctx.beginPath();
        ctx.arc(b.x - cx - 15, b.y - cy + 10, 8, 0, Math.PI * 2);
        ctx.arc(b.x - cx + 18, b.y - cy - 12, 6, 0, Math.PI * 2);
        ctx.arc(b.x - cx + 5, b.y - cy + 22, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function rysujAuto() {
    ctx.save();
    ctx.translate(auto.x - kamera.x, auto.y - kamera.y);
    ctx.rotate(auto.ang);

    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";   // cień
    ctx.fillRect(-14, -7, 36, 20);

    ctx.fillStyle = "#222";                  // koła
    ctx.fillRect(-15, -13, 9, 5);
    ctx.fillRect(-15, 8, 9, 5);
    ctx.fillRect(8, -13, 9, 5);
    ctx.fillRect(8, 8, 9, 5);

    ctx.fillStyle = "#e53935";               // karoseria
    ctx.fillRect(-18, -10, 36, 20);

    ctx.fillStyle = "#90caf9";               // szyba
    ctx.fillRect(2, -7, 10, 14);

    ctx.fillStyle = "#ffeb3b";               // światła z przodu
    ctx.fillRect(16, -7, 3, 5);
    ctx.fillRect(16, 2, 3, 5);

    ctx.restore();
}

function rysuj() {
    const cx = kamera.x, cy = kamera.y;

    rysujTrawe(cx, cy);

    // trasa: najpierw żwir, potem asfalt, na wierzchu przerywana linia
    sciezka(2 * (PULA + ZWIR), "#b89b72", cx, cy);
    sciezka(2 * PULA, "#4a4a4a", cx, cy);
    ctx.setLineDash([18, 18]);
    sciezka(3, "#f5f5f5", cx, cy);
    ctx.setLineDash([]);

    rysujBloto(cx, cy);

    // ślad po poślizgu (im starszy, tym bledszy)
    for (let i = 0; i < slad.length; i++) {
        ctx.fillStyle = "rgba(20, 20, 20, " + (0.35 * (i / slad.length)) + ")";
        ctx.beginPath();
        ctx.arc(slad[i].x - cx, slad[i].y - cy, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // linia startu/mety
    const p0 = trasa[0];
    const nx = -Math.sin(startAng), ny = Math.cos(startAng);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 6;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(p0.x + nx * PULA - cx, p0.y + ny * PULA - cy);
    ctx.lineTo(p0.x - nx * PULA - cx, p0.y - ny * PULA - cy);
    ctx.stroke();
    ctx.setLineDash([]);

    // następny punkt kontrolny (żółte kółko)
    const cp = trasa[PUNKTY_CP[nastepnyCP]];
    ctx.strokeStyle = "#f9d71c";
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(cp.x - cx, cp.y - cy, CP_R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    rysujAuto();
    rysujHUD();
}

function rysujHUD() {
    const mat = powierzchnia(auto.x, auto.y);
    const kmh = Math.round(Math.hypot(auto.vx, auto.vy) * 0.3);

    // panel z danymi
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(10, 50, 260, 172);
    ctx.textAlign = "left";
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Arial";
    ctx.fillText(t("rajd_nazwa").toUpperCase() + " · " + nick, 20, 74);
    ctx.font = "15px Arial";
    ctx.fillText(t("rajd_czas") + " " + fmtCzas(czas), 20, 98);
    ctx.fillText(t("rajd_okrazenie") + " " + Math.min(okrazenie + 1, OKRAZEN) + "/" + OKRAZEN, 20, 120);
    ctx.fillText(t("rajd_predkosc") + " " + kmh + " km/h", 20, 142);
    ctx.fillText(t("rajd_nawierzchnia") + " " + t(mat.nazwa), 20, 164);
    ctx.fillText(t("rajd_najlepszy") + " " + (najlepszy !== null ? fmtCzas(najlepszy) : "--"), 20, 186);

    // lista czasów okrążeń
    if (lapTimes.length > 0) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(W - 190, 10, 180, 30 + lapTimes.length * 20);
        ctx.fillStyle = "white";
        ctx.font = "bold 15px Arial";
        ctx.fillText(t("rajd_okrazenia"), W - 180, 30);
        ctx.font = "14px Arial";
        for (let i = 0; i < lapTimes.length; i++) {
            ctx.fillText((i + 1) + ". " + fmtCzas(lapTimes[i]), W - 180, 50 + i * 20);
        }
    }

    // sterowanie na dole
    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
    ctx.fillRect(10, H - 34, 600, 24);
    ctx.fillStyle = "white";
    ctx.font = "13px Arial";
    ctx.fillText(t("rajd_sterowanie"), 18, H - 17);

    // komunikaty na środku
    ctx.textAlign = "center";
    if (!running && !finished) {
        ctx.font = "bold 22px Arial";
        ctx.fillStyle = "white";
        ctx.fillText(t("rajd_ruszaj"), W / 2, 80);
    }
    if (finished) {
        const wysokosc = 230 + top3.length * 22;
        const y0 = H / 2 - wysokosc / 2;
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(W / 2 - 230, y0, 460, wysokosc);

        ctx.fillStyle = "#f9d71c";
        ctx.font = "bold 40px Arial";
        ctx.fillText(t("rajd_meta"), W / 2, y0 + 50);
        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.fillText(t("rajd_czas") + " " + fmtCzas(czas), W / 2, y0 + 86);
        ctx.font = "18px Arial";
        ctx.fillText(t("rajd_najlepszy") + " " + fmtCzas(najlepszy), W / 2, y0 + 114);

        ctx.fillStyle = "#f9d71c";
        ctx.font = "bold 16px Arial";
        ctx.fillText(t("rajd_top3"), W / 2, y0 + 148);
        ctx.fillStyle = "white";
        ctx.font = "16px Arial";
        for (let i = 0; i < top3.length; i++) {
            ctx.fillText((i + 1) + ". " + top3[i][0] + "  " + fmtCzas(top3[i][1]), W / 2, y0 + 172 + i * 22);
        }
        ctx.font = "16px Arial";
        ctx.fillText(t("rajd_jeszcze_raz"), W / 2, y0 + wysokosc - 18);
    }
    ctx.textAlign = "left";
}
// ---------- 8. STEROWANIE ----------
document.addEventListener("keydown", function (e) {
    klawisze[e.code] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
        e.preventDefault();
    }
    if (e.code === "KeyR") reset();
});
