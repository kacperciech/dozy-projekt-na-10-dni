<!DOCTYPE html>
<html lang="pl">
<head>
<!-- Ustawienia dokumentu i style strony rajdu, w tym kolory przycisku motywu. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajdówka</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: var(--rajd-tlo, #111);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  html {
    --rajd-tlo: linear-gradient(135deg, #151825 0%, #1b2933 52%, #18352e 100%);
    --rajd-przycisk-tlo: #252a33;
    --rajd-przycisk-tekst: #f2f2f7;
  }
  html[data-theme="light"] {
    --rajd-tlo: linear-gradient(135deg, #7898d6 0%, #50ddd1 52%, #a1c782 100%);
    --rajd-przycisk-tlo: #fff;
    --rajd-przycisk-tekst: #20242b;
  }
  canvas {
    width: 960px;
    max-width: 100%;
    height: auto;
    border: 3px solid #333;
    background: #000;
  }
  .menu-link {
    position: fixed;
    top: 10px;
    left: 14px;
    z-index: 5;
    color: #4EC0CA;
    text-decoration: none;
    font-weight: bold;
    background: rgba(0, 0, 0, 0.55);
    padding: 6px 12px;
    border-radius: 8px;
  }
  .menu-link:hover {
    color: #f9d71c;
  }
  .motyw-przelacznik {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 5;
    padding: 8px 14px;
    border: 1px solid #4EC0CA;
    border-radius: 20px;
    background: var(--rajd-przycisk-tlo);
    color: var(--rajd-przycisk-tekst);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .motyw-przelacznik:hover {
    border-color: #f9d71c;
  }
  </style>
</head>
<body>
<!-- Odnośnik powrotny do menu oraz globalny przełącznik motywu. -->
<a href="index.html" class="menu-link" data-i18n="menu">← Menu</a>
<button type="button" class="motyw-przelacznik" data-motyw-przelacz aria-label="Jasny motyw">
  <span aria-hidden="true">☀️</span>
  <span data-motyw-etykieta>Jasny motyw</span>
</button>
<!-- Plansza rajdu renderowana na elemencie Canvas przez poniższy skrypt. -->
<canvas id="gra" width="960" height="540"></canvas>

<!-- Wczytanie tłumaczeń, motywu oraz logiki gry rajdowej. -->
<script src="rowerek.js"></script>
<script>
// ---------- 0. GRACZ ----------
// Nick wpisuje się na stronie głównej. Bez nicku wracamy do menu.
const nick = localStorage.getItem("nick") || "";
if (nick === "") location.replace("index.html");

document.title = t("rajd_nazwa");
// ---------- 1. USTAWIENIA ----------
const canvas = document.getElementById("gra");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const SWIAT_W = 2400;
const SWIAT_H = 1600;
const CX = 1200;           // środek trasy
const CY = 800;
const N = 180;             // liczba punktów na trasie
const PULA = 48;           // połowa szerokości jezdni
const ZWIR = 40;           // pas żwiru po bokach jezdni
const PLOT_ODLEGLOSC = PULA + ZWIR + 22;
const PROMIEN_AUTA = 18;
const OKRAZEN = 3;         // ile okrążeń w wyścigu
const CP_R = 75;           // promień punktu kontrolnego
const KLUCZ = "wyniki_rajd";   // tak samo czyta to strona główna

// Nawierzchnie: przyczepność (grip) i maksymalna prędkość
const MAT = {
    asfalt: { nazwa: "nawierz_asfalt", przyczepnosc: 1.0,  vmax: 520 },
    piasek: { nazwa: "nawierz_piasek", przyczepnosc: 0.4,  vmax: 300 },
    zwir:   { nazwa: "nawierz_zwir",   przyczepnosc: 0.6,  vmax: 400 },
    trawa:  { nazwa: "nawierz_trawa",  przyczepnosc: 0.45, vmax: 280 },
    blato:  { nazwa: "nawierz_blato",  przyczepnosc: 0.25, vmax: 220 }
};
// ---------- 2. TRASA ----------
// Parametry map opisują kształt pętli i odcinki o różnych nawierzchniach.
const MAPY = [
    {
        nazwa: "rajd_mapa_lesna",
        baza: 560, fala1: 65, czest1: 3, fala2: 12, czest2: 5, faza: 0, skalaY: 0.9,
        nawierzchnie: [[18, 34, "piasek"], [48, 58, "blato"], [78, 96, "piasek"], [112, 125, "blato"], [148, 164, "piasek"]]
    },
    {
        nazwa: "rajd_mapa_pustynna",
        baza: 560, fala1: 70, czest1: 2, fala2: 18, czest2: 3, faza: 0.8, skalaY: 0.82,
        nawierzchnie: [[10, 30, "piasek"], [42, 54, "blato"], [68, 84, "piasek"], [102, 118, "blato"], [138, 160, "piasek"]]
    },
    {
        nazwa: "rajd_mapa_gorska",
        baza: 560, fala1: 65, czest1: 3, fala2: 15, czest2: 4, faza: 1.3, skalaY: 0.88,
        nawierzchnie: [[22, 38, "blato"], [56, 76, "piasek"], [96, 108, "blato"], [128, 148, "piasek"], [164, 176, "blato"]]
    },
    {
        nazwa: "rajd_mapa_nadrzeczna",
        baza: 560, fala1: 70, czest1: 2, fala2: 20, czest2: 3, faza: 2.1, skalaY: 0.8,
        nawierzchnie: [[14, 28, "piasek"], [38, 56, "blato"], [82, 100, "piasek"], [120, 134, "blato"], [154, 172, "piasek"]]
    }
];
let wybranaMapa = 0;
let trasa = [];
let startAng;

// Tworzy punkty trasy na podstawie parametrów wybranej mapy.
function wczytajMape(indeks) {
    wybranaMapa = indeks;
    const mapa = MAPY[wybranaMapa];
    trasa = [];
    // Kąt dzieli pełne okrążenie na punkty; fale zmieniają promień i tworzą zakręty.
    for (let i = 0; i < N; i++) {
        const th = (i / N) * Math.PI * 2;
        const r = mapa.baza +
            mapa.fala1 * Math.sin(mapa.czest1 * th + mapa.faza) +
            mapa.fala2 * Math.cos(mapa.czest2 * th - mapa.faza);
        trasa.push({ x: CX + r * Math.cos(th), y: CY + r * Math.sin(th) * mapa.skalaY });
    }
    startAng = Math.atan2(trasa[1].y - trasa[0].y, trasa[1].x - trasa[0].x);
}

// Zwraca rodzaj nawierzchni przypisany do danego odcinka trasy.
function nawierzchniaTrasy(indeks) {
    // Indeks może wyjść poza koniec okrążenia, dlatego sprowadzamy go do zakresu 0..N-1.
    const punkt = ((indeks % N) + N) % N;
    const odcinki = MAPY[wybranaMapa].nawierzchnie;
    for (let i = 0; i < odcinki.length; i++) {
        if (punkt >= odcinki[i][0] && punkt < odcinki[i][1]) return MAT[odcinki[i][2]];
    }
    return MAT.asfalt;
}

// Punkty kontrolne w kolejności: indeksy punktów trasy.
// Ostatni (0) to meta, czyli punkt startu.
const PUNKTY_CP = [30, 60, 90, 0];

wczytajMape(wybranaMapa);
// ---------- 3. WYNIKI (czas w sekundach, im mniej tym lepiej) ----------
// Odczytuje zapisane czasy graczy z pamięci przeglądarki.
function wczytajWyniki() {
    try {
        return JSON.parse(localStorage.getItem(KLUCZ)) || {};
    } catch (e) {
        return {};
    }
}
// ---------- 4. STAN GRY ----------
let auto, czas, running, finished, okrazenie, nastepnyCP, lapStart, lapTimes, slad;
let top3 = [];
let kamera = { x: 0, y: 0 };
const klawisze = {};

let najlepszy = wczytajWyniki()[nick];
if (najlepszy === undefined) najlepszy = null;

// Przygotowuje stan wyścigu od początku, zachowując wybraną mapę.
function reset() {
    auto = { x: trasa[0].x, y: trasa[0].y, ang: startAng, vx: 0, vy: 0 };
    czas = 0;
    running = false;   // zegar rusza po pierwszym wciśnięciu klawisza
    finished = false;
    okrazenie = 0;
    nastepnyCP = 0;
    lapStart = 0;
    lapTimes = [];
    slad = [];
}
// ---------- 5. POMOCNICZE ----------
// Wyszukuje najbliższy punkt trasy względem współrzędnych samochodu.
function najblizszyPunkt(x, y) {
    let best = { odleglosc: Infinity, x: 0, y: 0, indeks: 0 };
    for (let i = 0; i < trasa.length; i++) {
        const a = trasa[i];
        const b = trasa[(i + 1) % trasa.length];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dlugosc2 = dx * dx + dy * dy;
        // Rzut na odcinek daje dokładniejszą odległość niż sprawdzanie samych punktów trasy.
        const udzial = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / dlugosc2));
        const px = a.x + dx * udzial, py = a.y + dy * udzial;
        const odleglosc = Math.hypot(px - x, py - y);
        if (odleglosc < best.odleglosc) {
            best = { odleglosc: odleglosc, x: px, y: py, indeks: i + udzial };
        }
    }
    return best;
}

// Określa nawierzchnię pod samochodem, by dobrać przyczepność i limit prędkości.
function powierzchnia(x, y) {
    const najblizszy = najblizszyPunkt(x, y);
    // Odległość od środka trasy rozróżnia jezdnię, żwirowe pobocze i trawę.
    if (najblizszy.odleglosc <= PULA) return nawierzchniaTrasy(najblizszy.indeks);
    if (najblizszy.odleglosc <= PULA + ZWIR) return MAT.zwir;
    return MAT.trawa;
}

// Zamienia czas w sekundach na czytelny zapis minut, sekund i setnych.
function fmtCzas(s) {
    const min = Math.floor(s / 60);
    const sek = (s % 60).toFixed(2).padStart(5, "0");
    return min + ":" + sek;
}

// Sprawdza, czy dowolny klawisz z podanej grupy jest aktualnie wciśnięty.
function wcisniete(kody) {
    return kody.some(function (k) { return klawisze[k]; });
}

const GAZ = ["ArrowUp", "KeyW"];
const HAMULEC = ["ArrowDown", "KeyS"];
const LEWO = ["ArrowLeft", "KeyA"];
const PRAWO = ["ArrowRight", "KeyD"];
const RECZNY = ["Space"];
// ---------- 6. FIZYKA ----------
// Aktualizuje fizykę auta, postęp okrążeń i stan wyścigu dla jednej klatki.
function aktualizuj(dt) {
    // dt to czas od poprzedniej klatki w sekundach, więc fizyka nie zależy od FPS.
    const mat = powierzchnia(auto.x, auto.y);

    const gaz = wcisniete(GAZ);
    const ham = wcisniete(HAMULEC);
    const lewo = wcisniete(LEWO);
    const prawo = wcisniete(PRAWO);
    const reczny = wcisniete(RECZNY);

    if (gaz || ham || lewo || prawo || reczny) running = true;

    // przyspieszanie w kierunku, w którym patrzy auto
    let fx = Math.cos(auto.ang);
    let fy = Math.sin(auto.ang);
    if (gaz) {
        auto.vx += fx * 300 * dt;
        auto.vy += fy * 300 * dt;
    }

    // hamowanie lub jazda wstecz
    let wzdluz = auto.vx * fx + auto.vy * fy;
    if (ham) {
        if (wzdluz > 10) {
            const k = Math.max(0, 1 - 3 * dt);
            auto.vx *= k;
            auto.vy *= k;
        } else {
            auto.vx -= fx * 120 * dt;
            auto.vy -= fy * 120 * dt;
        }
    }

    // opór toczenia
    const opor = Math.max(0, 1 - 0.35 * dt);
    auto.vx *= opor;
    auto.vy *= opor;

    // limit prędkości zależny od nawierzchni
    let predkosc = Math.hypot(auto.vx, auto.vy);
    if (predkosc > mat.vmax) {
        const s = mat.vmax / predkosc;
        auto.vx *= s;
        auto.vy *= s;
        predkosc = mat.vmax;
    }

    // skręcanie: im szybciej, tym mocniej, ale w mało szybkim aucie nie skręcisz
    const sf = Math.min(1, predkosc / 150);
    const kierunek = wzdluz >= 0 ? 1 : -1;
    if (lewo) auto.ang -= 2.4 * sf * kierunek * dt;
    if (prawo) auto.ang += 2.4 * sf * kierunek * dt;

    // przyczepność: rozkładamy prędkość na "do przodu" i "w bok",
    // bok z czasem wygasa. Na błocie wygasa wolno, więc auto ślizga.
    fx = Math.cos(auto.ang);
    fy = Math.sin(auto.ang);
    let wz = auto.vx * fx + auto.vy * fy;
    let latx = auto.vx - fx * wz;
    let laty = auto.vy - fy * wz;

    const przyczepnosc = mat.przyczepnosc * (reczny ? 0.25 : 1);
    const tlum = Math.max(0, 1 - przyczepnosc * 8 * dt);
    latx *= tlum;
    laty *= tlum;

    if (reczny) wz *= Math.max(0, 1 - 1.5 * dt);   // hamulec ręczny też hamuje

    auto.vx = fx * wz + latx;
    auto.vy = fy * wz + laty;

    // ślad po poślizgu
    const bok = Math.hypot(latx, laty);
    if (bok > 70) {
        slad.push({ x: auto.x, y: auto.y });
        if (slad.length > 400) slad.shift();
    }

    // ruch
    auto.x += auto.vx * dt;
    auto.y += auto.vy * dt;

    // Płoty biegną po obu stronach trasy i nie pozwalają jej skracać.
    const najblizszy = najblizszyPunkt(auto.x, auto.y);
    const granicaPlotu = PLOT_ODLEGLOSC - PROMIEN_AUTA;
    if (najblizszy.odleglosc > granicaPlotu) {
        const nx = (auto.x - najblizszy.x) / najblizszy.odleglosc;
        const ny = (auto.y - najblizszy.y) / najblizszy.odleglosc;
        auto.x = najblizszy.x + nx * granicaPlotu;
        auto.y = najblizszy.y + ny * granicaPlotu;
        const predkoscProstopadla = auto.vx * nx + auto.vy * ny;
        if (predkoscProstopadla > 0) {
            auto.vx -= nx * predkoscProstopadla;
            auto.vy -= ny * predkoscProstopadla;
        }
    }

    // granice świata
    if (auto.x < 20) { auto.x = 20; auto.vx = 0; }
    if (auto.x > SWIAT_W - 20) { auto.x = SWIAT_W - 20; auto.vx = 0; }
    if (auto.y < 20) { auto.y = 20; auto.vy = 0; }
    if (auto.y > SWIAT_H - 20) { auto.y = SWIAT_H - 20; auto.vy = 0; }

    // punkty kontrolne i okrążenia
    // Okrążenie zalicza się dopiero po minięciu wszystkich punktów kontrolnych po kolei.
    const cp = trasa[PUNKTY_CP[nastepnyCP]];
    if (Math.hypot(auto.x - cp.x, auto.y - cp.y) < CP_R) {
        nastepnyCP++;
        if (nastepnyCP === PUNKTY_CP.length) {
            nastepnyCP = 0;
            okrazenie++;
            lapTimes.push(czas - lapStart);
            lapStart = czas;
            if (okrazenie === OKRAZEN) koniec();
        }
    }
}

// Meta: zapisz czas gracza (tylko jeśli to jego najlepszy) i przygotuj TOP 3
// Zapisuje najlepszy czas kierowcy i kończy bieżący wyścig.
function koniec() {
    finished = true;
    running = false;

    const wyniki = wczytajWyniki();
    const wynik = Number(czas.toFixed(2));
    if (wyniki[nick] === undefined || wynik < wyniki[nick]) {
        wyniki[nick] = wynik;
        try {
            localStorage.setItem(KLUCZ, JSON.stringify(wyniki));
        } catch (e) {}
    }
    najlepszy = wyniki[nick];

    top3 = Object.entries(wyniki)
        .sort(function (a, b) { return a[1] - b[1]; })
        .slice(0, 3);
}
// ---------- 7. RYSOWANIE ----------
// Rysuje zamknięty obrys używany do elementów trasy.
function sciezka(szer, kolor, cx, cy) {
    ctx.beginPath();
    ctx.moveTo(trasa[0].x - cx, trasa[0].y - cy);
    for (let i = 1; i < trasa.length; i++) {
        ctx.lineTo(trasa[i].x - cx, trasa[i].y - cy);
    }
    ctx.closePath();
    ctx.lineWidth = szer;
    ctx.strokeStyle = kolor;
    ctx.lineJoin = "round";
    ctx.stroke();
}

// Maluje tło terenu wokół widocznej części toru.
function rysujTrawe(cx, cy) {
    ctx.fillStyle = "#4f7d2c";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    const gx0 = Math.floor(cx / 40), gx1 = Math.floor((cx + W) / 40);
    const gy0 = Math.floor(cy / 40), gy1 = Math.floor((cy + H) / 40);
    for (let gx = gx0; gx <= gx1; gx++) {
        for (let gy = gy0; gy <= gy1; gy++) {
            if ((gx * 31 + gy * 17) % 5 === 0) {
                ctx.fillRect(gx * 40 - cx + 8, gy * 40 - cy + 10, 12, 6);
            }
        }
    }
}

// Dodaje na jezdni oznaczenia fragmentów o odmiennej nawierzchni.
function rysujOdcinkiNawierzchni(cx, cy) {
    const odcinki = MAPY[wybranaMapa].nawierzchnie;
    // Każdy przedział mapy jest rysowany osobno na wierzchu asfaltu.
    for (let i = 0; i < odcinki.length; i++) {
        const poczatek = odcinki[i][0], koniec = odcinki[i][1];
        ctx.beginPath();
        ctx.moveTo(trasa[poczatek].x - cx, trasa[poczatek].y - cy);
        for (let j = poczatek + 1; j <= koniec; j++) {
            ctx.lineTo(trasa[j % N].x - cx, trasa[j % N].y - cy);
        }
        ctx.lineWidth = PULA * 2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = odcinki[i][2] === "blato" ? "#5a3b1e" : "#c5a66e";
        ctx.stroke();
    }
}

// Rysuje elementy pobocza wzdłuż trasy.
function rysujPloty(cx, cy) {
    for (let strona = -1; strona <= 1; strona += 2) {
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
            const przed = trasa[(i + N - 1) % N];
            const po = trasa[(i + 1) % N];
            const dx = po.x - przed.x, dy = po.y - przed.y;
            const dlugosc = Math.hypot(dx, dy);
            const x = trasa[i].x - (dy / dlugosc) * PLOT_ODLEGLOSC * strona;
            const y = trasa[i].y + (dx / dlugosc) * PLOT_ODLEGLOSC * strona;
            if (i === 0) ctx.moveTo(x - cx, y - cy);
            else ctx.lineTo(x - cx, y - cy);
        }
        ctx.closePath();
        ctx.strokeStyle = "#4b2e1b";
        ctx.lineWidth = 7;
        ctx.stroke();
        ctx.strokeStyle = "#c59a62";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#3b2618";
        for (let i = 0; i < N; i += 2) {
            const przed = trasa[(i + N - 1) % N];
            const po = trasa[(i + 1) % N];
            const dx = po.x - przed.x, dy = po.y - przed.y;
            const dlugosc = Math.hypot(dx, dy);
            const x = trasa[i].x - (dy / dlugosc) * PLOT_ODLEGLOSC * strona - cx;
            const y = trasa[i].y + (dx / dlugosc) * PLOT_ODLEGLOSC * strona - cy;
            ctx.fillRect(x - 3, y - 5, 6, 10);
        }
    }
}

// Rysuje samochód gracza w jego aktualnym położeniu i kierunku.
function rysujAuto() {
    ctx.save();
    ctx.translate(auto.x - kamera.x, auto.y - kamera.y);
    ctx.rotate(auto.ang);

    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";   // cień
    ctx.fillRect(-14, -7, 36, 20);

    ctx.fillStyle = "#222";                  // koła
    ctx.fillRect(-15, -13, 9, 5);
    ctx.fillRect(-15, 8, 9, 5);
    ctx.fillRect(8, -13, 9, 5);
    ctx.fillRect(8, 8, 9, 5);

    ctx.fillStyle = "#e53935";               // karoseria
    ctx.fillRect(-18, -10, 36, 20);

    ctx.fillStyle = "#90caf9";               // szyba
    ctx.fillRect(2, -7, 10, 14);

    ctx.fillStyle = "#ffeb3b";               // światła z przodu
    ctx.fillRect(16, -7, 3, 5);
    ctx.fillRect(16, 2, 3, 5);

    ctx.restore();
}

// Czyści i odtwarza kompletny obraz aktualnej klatki rajdu.
function rysuj() {
    const cx = kamera.x, cy = kamera.y;

    rysujTrawe(cx, cy);

    // trasa: najpierw żwir, potem asfalt, na wierzchu przerywana linia
    sciezka(2 * (PULA + ZWIR), "#b89b72", cx, cy);
    sciezka(2 * PULA, "#4a4a4a", cx, cy);
    rysujOdcinkiNawierzchni(cx, cy);
    ctx.setLineDash([18, 18]);
    sciezka(3, "#f5f5f5", cx, cy);
    ctx.setLineDash([]);
    rysujPloty(cx, cy);

    // ślad po poślizgu (im starszy, tym bledszy)
    for (let i = 0; i < slad.length; i++) {
        ctx.fillStyle = "rgba(20, 20, 20, " + (0.35 * (i / slad.length)) + ")";
        ctx.beginPath();
        ctx.arc(slad[i].x - cx, slad[i].y - cy, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // linia startu/mety
    const p0 = trasa[0];
    const nx = -Math.sin(startAng), ny = Math.cos(startAng);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 6;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(p0.x + nx * PULA - cx, p0.y + ny * PULA - cy);
    ctx.lineTo(p0.x - nx * PULA - cx, p0.y - ny * PULA - cy);
    ctx.stroke();
    ctx.setLineDash([]);

    // następny punkt kontrolny (żółte kółko)
    const cp = trasa[PUNKTY_CP[nastepnyCP]];
    ctx.strokeStyle = "#f9d71c";
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(cp.x - cx, cp.y - cy, CP_R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    rysujAuto();
    rysujHUD();
}

// Wyświetla informacje o czasie, okrążeniu, prędkości i wynikach.
function rysujHUD() {
    const mat = powierzchnia(auto.x, auto.y);
    const kmh = Math.round(Math.hypot(auto.vx, auto.vy) * 0.3);

    // panel z danymi
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(10, 50, 280, 194);
    ctx.textAlign = "left";
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Arial";
    ctx.fillText(t("rajd_nazwa").toUpperCase() + " · " + nick, 20, 74);
    ctx.font = "15px Arial";
    ctx.fillText(t("rajd_mapa") + " " + t(MAPY[wybranaMapa].nazwa), 20, 98);
    ctx.fillText(t("rajd_czas") + " " + fmtCzas(czas), 20, 120);
    ctx.fillText(t("rajd_okrazenie") + " " + Math.min(okrazenie + 1, OKRAZEN) + "/" + OKRAZEN, 20, 142);
    ctx.fillText(t("rajd_predkosc") + " " + kmh + " km/h", 20, 164);
    ctx.fillText(t("rajd_nawierzchnia") + " " + t(mat.nazwa), 20, 186);
    ctx.fillText(t("rajd_najlepszy") + " " + (najlepszy !== null ? fmtCzas(najlepszy) : "--"), 20, 208);

    // lista czasów okrążeń
    if (lapTimes.length > 0) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(W - 190, 10, 180, 30 + lapTimes.length * 20);
        ctx.fillStyle = "white";
        ctx.font = "bold 15px Arial";
        ctx.fillText(t("rajd_okrazenia"), W - 180, 30);
        ctx.font = "14px Arial";
        for (let i = 0; i < lapTimes.length; i++) {
            ctx.fillText((i + 1) + ". " + fmtCzas(lapTimes[i]), W - 180, 50 + i * 20);
        }
    }

    // sterowanie na dole
    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
    ctx.fillRect(10, H - 40, 760, 30);
    ctx.fillStyle = "white";
    ctx.font = "13px Arial";
    ctx.fillText(t("rajd_sterowanie"), 18, H - 20);

    // komunikaty na środku
    ctx.textAlign = "center";
    if (!running && !finished) {
        ctx.font = "bold 22px Arial";
        ctx.fillStyle = "white";
        ctx.fillText(t("rajd_ruszaj"), W / 2, 80);
        ctx.font = "16px Arial";
        ctx.fillText(t("rajd_wybor_mapy"), W / 2, 106);
    }
    if (finished) {
        const wysokosc = 230 + top3.length * 22;
        const y0 = H / 2 - wysokosc / 2;
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(W / 2 - 230, y0, 460, wysokosc);

        ctx.fillStyle = "#f9d71c";
        ctx.font = "bold 40px Arial";
        ctx.fillText(t("rajd_meta"), W / 2, y0 + 50);
        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.fillText(t("rajd_czas") + " " + fmtCzas(czas), W / 2, y0 + 86);
        ctx.font = "18px Arial";
        ctx.fillText(t("rajd_najlepszy") + " " + fmtCzas(najlepszy), W / 2, y0 + 114);

        ctx.fillStyle = "#f9d71c";
        ctx.font = "bold 16px Arial";
        ctx.fillText(t("rajd_top3"), W / 2, y0 + 148);
        ctx.fillStyle = "white";
        ctx.font = "16px Arial";
        for (let i = 0; i < top3.length; i++) {
            ctx.fillText((i + 1) + ". " + top3[i][0] + "  " + fmtCzas(top3[i][1]), W / 2, y0 + 172 + i * 22);
        }
        ctx.font = "16px Arial";
        ctx.fillText(t("rajd_jeszcze_raz"), W / 2, y0 + wysokosc - 18);
    }
    ctx.textAlign = "left";
}
// ---------- 8. STEROWANIE ----------
// Obsługa klawiatury: jazda, zmiana mapy, hamulec ręczny i restart.
document.addEventListener("keydown", function (e) {
    klawisze[e.code] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
        e.preventDefault();
    }
    if (e.code === "KeyR") reset();
    if (!running && !finished && (e.code === "KeyQ" || e.code === "KeyE")) {
        const kierunek = e.code === "KeyE" ? 1 : -1;
        wczytajMape((wybranaMapa + kierunek + MAPY.length) % MAPY.length);
        reset();
    }
});
document.addEventListener("keyup", function (e) {
    klawisze[e.code] = false;
});
// ---------- 9. PĘTLA ----------
// Pętla animacji mierzy czas klatki, aktualizuje grę i ponawia rysowanie.
let ostatni = 0;

function petla(tCzas) {
    // Ograniczenie dt zapobiega dużemu skokowi auta po chwilowym spowolnieniu karty.
    const dt = ostatni ? Math.min((tCzas - ostatni) / 1000, 0.05) : 0;
    ostatni = tCzas;

    if (!finished) {
        if (running) czas += dt;
        aktualizuj(dt);
    }

    kamera.x = Math.max(0, Math.min(SWIAT_W - W, auto.x - W / 2));
    kamera.y = Math.max(0, Math.min(SWIAT_H - H, auto.y - H / 2));

    rysuj();
    requestAnimationFrame(petla);
}

reset();
requestAnimationFrame(petla);
</script>
